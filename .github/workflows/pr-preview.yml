name: GitHub Pages & PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # Deploy main site to gh-pages on push to main
  deploy-main:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build standalone bundle
        run: yarn build:standalone

      # One script assembles the tree, for this job and the preview job alike, so
      # the preview is the same site as production rather than a second
      # arrangement of the same files. It copies without renaming and lists no
      # demos; index.html is the one place the site's contents are named.
      - name: Assemble the site
        run: scripts/build-site.sh _site

      # A published page nothing links to is a page nobody finds -- which is how
      # the trial harness came to be deployed by both jobs and listed by neither.
      - name: Check the site for dead links and unreachable pages
        run: node scripts/check-site.js _site

      - name: Deploy main site to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          keep_files: true

  # Deploy PR preview to gh-pages/pr/<number>/
  deploy-preview:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # build-site.sh fails with a named error if the bundle is missing.
      - name: Build standalone bundle
        run: yarn build:standalone

      # The same script as the main deploy, so what a reviewer clicks is the
      # site they are about to publish -- including the root landing page, which
      # the old preview omitted entirely.
      - name: Assemble the site
        run: scripts/build-site.sh preview

      - name: Check the site for dead links and unreachable pages
        run: node scripts/check-site.js preview

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./preview
          destination_dir: pr/${{ github.event.pull_request.number }}
          keep_files: true

      - name: Comment on PR with preview link
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const owner = context.repo.owner.toLowerCase();
            const repo = context.repo.repo;
            const previewUrl = `https://${owner}.github.io/${repo}/pr/${prNumber}/`;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const marker = '<!-- pr-preview-comment -->';
            const botComment = comments.data.find(c => c.body.includes(marker));

            const body = [
              marker,
              '### PR Preview',
              '',
              `Preview deployment is ready! **[View Preview](${previewUrl})**`,
              '',
              `_Last updated: ${new Date().toISOString()}_`,
            ].join('\n');

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

  # Clean up preview when PR is closed
  cleanup-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1

      - name: Remove preview directory
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          if [ -d "pr/$PR_NUMBER" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git rm -rf "pr/$PR_NUMBER"
            git commit -m "Remove PR #$PR_NUMBER preview"
            git push origin gh-pages
          else
            echo "No preview directory found for PR #$PR_NUMBER, nothing to clean up"
          fi
