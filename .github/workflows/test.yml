name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  playwright:
    name: Playwright tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Hygiene ratchet
        run: yarn hygiene

      - name: Lint
        run: yarn lint

      - name: Type check
        run: yarn typecheck

      - name: Unit tests
        run: yarn test:unit

      - name: Build
        run: yarn build

      - name: Build standalone bundle
        run: yarn build:standalone

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: yarn test

  webkit-smoke:
    name: WebKit smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Playwright WebKit
        run: npx playwright install --with-deps webkit

      - name: Run smoke test on WebKit
        run: yarn test:webkit
