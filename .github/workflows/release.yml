name: Release

# Trigger on version tags (v*.*.*)
on:
  push:
    tags:
      - 'v*.*.*'

# Permissions required for creating releases
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for changelog generation

      - name: Validate tag format
        id: validate-tag
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "Tag: $TAG"
          
          # Validate semantic versioning format (v*.*.*)
          if [[ ! $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid tag format. Expected format: v*.*.* (e.g., v1.0.0)"
            echo "Received: $TAG"
            exit 1
          fi
          
          # Extract version without 'v' prefix
          VERSION=${TAG#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "✅ Tag format validated: $TAG (version: $VERSION)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install dependencies
        run: |
          echo "📦 Installing dependencies..."
          yarn install --frozen-lockfile

      - name: Install Playwright browsers
        run: |
          echo "🎭 Installing Playwright browsers..."
          yarn playwright install

      # The release gate must be at least as strict as the PR gate (R9-05).
      # It used to run typecheck, build and Playwright but neither `yarn lint`
      # nor `yarn hygiene`, so a release cut from a branch that never went
      # through a PR could ship a lint or ratchet regression. These are the
      # same five checks `test.yml` runs, in the same order.
      - name: Hygiene ratchet (cycles, unused exports, waitForTimeout)
        run: |
          echo "📏 Running hygiene ratchet..."
          yarn hygiene

      - name: Lint
        run: |
          echo "🧹 Running lint..."
          yarn lint

      - name: Run type checking
        run: |
          echo "🔍 Running type checking..."
          yarn typecheck

      - name: Unit tests
        run: |
          echo "🔬 Running unit tests..."
          yarn test:unit

      - name: Check the tag matches package.json
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${{ steps.validate-tag.outputs.version }}"

          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ Version mismatch: package.json has '$PACKAGE_VERSION', tag expects '$TAG_VERSION'"
            exit 1
          fi

          echo "✅ package.json version matches the tag: $PACKAGE_VERSION"

      - name: Build standalone version
        run: |
          echo "🏗️ Building standalone version for file:// protocol compatibility..."
          yarn build:standalone
          
          # Verify standalone bundle exists
          if [ ! -f "dist/gramframe.bundle.js" ]; then
            echo "❌ Standalone build failed: gramframe.bundle.js not found"
            exit 1
          fi
          
          # Check bundle size (should be substantial due to inlined CSS/assets)
          BUNDLE_SIZE=$(stat -c%s "dist/gramframe.bundle.js" 2>/dev/null || stat -f%z "dist/gramframe.bundle.js")
          if [ "$BUNDLE_SIZE" -lt 100000 ]; then
            echo "❌ Standalone bundle too small ($BUNDLE_SIZE bytes), likely incomplete"
            exit 1
          fi
          
          # The version is injected into the bundle at build time (no tracked
          # file is rewritten), so verify it landed in the shipped artifact.
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if ! grep -q "\"$PACKAGE_VERSION\"" dist/gramframe.bundle.js; then
            echo "❌ Bundle does not carry version $PACKAGE_VERSION"
            exit 1
          fi

          echo "✅ Standalone build successful"
          echo "📋 Bundle size: $BUNDLE_SIZE bytes"
          echo "📋 Standalone build contents:"
          ls -la dist/

      - name: Run tests
        run: |
          echo "🧪 Running tests..."
          yarn test

      - name: Prepare release assets
        id: assets
        run: |
          echo "📦 Preparing release assets..."
          
          # Create release directory
          mkdir -p release-assets
          
          # Copy standalone bundle (the only build users need)
          cp dist/gramframe.bundle.js release-assets/
          
          # Copy test HTML file and required assets. The demo gram is a
          # small synthetic spectrogram committed at sample/demo-gram.png,
          # not one of the large photographic sample images.
          cp test-release.html release-assets/index.html
          cp sample/demo-gram.png release-assets/
          
          # Create simple verification file
          cat > release-assets/README.md << 'EOF'
          # GramFrame Release
          
          ## Quick Start
          
          1. **Double-click `index.html`** from your file explorer
          2. The component will load automatically - no web server required!
          3. Test all interactions with the spectrogram
          
          ## Files Included
          
          - **`gramframe.bundle.js`** - Complete GramFrame component (file:// compatible)
          - **`index.html`** - Sample HTML page demonstrating usage
          - **`demo-gram.png`** - Synthetic demo spectrogram (harmonic stack, sidebands, Doppler curve)
          - **`README.md`** - This guide
          
          ## How to Use in Your Training Materials
          
          1. Include `gramframe.bundle.js` in your HTML training materials
          2. Add spectrogram configuration tables with class `gram-config`
          3. Component auto-initializes when the page loads
          
          ### Example HTML Structure
          
          ```html
          <!DOCTYPE html>
          <html>
          <head>
              <title>Training Material</title>
          </head>
          <body>
              <h1>Spectrogram Analysis</h1>
              
              <!-- Your spectrogram configuration -->
              <table class="gram-config">
                  <tr>
                      <td colspan="2"><img src="your-spectrogram.png" alt="Spectrogram"></td>
                  </tr>
                  <tr><td>time-start</td><td>0</td></tr>
                  <tr><td>time-end</td><td>10</td></tr>
                  <tr><td>freq-start</td><td>0</td></tr>
                  <tr><td>freq-end</td><td>100</td></tr>
              </table>
              
              <!-- Load GramFrame component -->
              <script src="./gramframe.bundle.js"></script>
          </body>
          </html>
          ```
          
          ## Technical Details
          
          - **File Protocol Compatible**: Works with `file://` URLs (double-click HTML files)
          - **Self-Contained**: All CSS and assets bundled in single JavaScript file
          - **Auto-Detection**: Automatically finds and enhances `gram-config` tables
          - **No Dependencies**: No external libraries or web server required
          
          ## Version Information
          
          - **Version**: ${{ steps.validate-tag.outputs.version }}
          - **Tag**: ${{ steps.validate-tag.outputs.tag }}
          - **Build Date**: $(date -u)
          - **Bundle Size**: $(du -h dist/gramframe.bundle.js | cut -f1)
          EOF
          
          # Create compressed archive
          ARCHIVE_NAME="gramframe-${{ steps.validate-tag.outputs.version }}.zip"
          cd release-assets && zip -9r "../$ARCHIVE_NAME" . && cd ..

          # Upper-bound size ratchet. The archive is ~88KB; anything approaching
          # this ceiling means a large asset crept back in (it was 561KB when a
          # photographic sample gram was shipped). Same spirit as `yarn hygiene`.
          MAX_ARCHIVE_BYTES=150000
          ARCHIVE_SIZE=$(stat -c%s "$ARCHIVE_NAME" 2>/dev/null || stat -f%z "$ARCHIVE_NAME")
          if [ "$ARCHIVE_SIZE" -gt "$MAX_ARCHIVE_BYTES" ]; then
            echo "❌ Release archive is $ARCHIVE_SIZE bytes, over the $MAX_ARCHIVE_BYTES budget"
            echo "   Check for a large asset added to release-assets/."
            exit 1
          fi
          echo "✅ Archive size: $ARCHIVE_SIZE bytes (budget $MAX_ARCHIVE_BYTES)"

          echo "archive-name=$ARCHIVE_NAME" >> $GITHUB_OUTPUT
          echo "✅ Release assets prepared"
          echo "📋 Asset contents:"
          ls -la release-assets/
          echo "📦 Archive contents:"
          unzip -l "$ARCHIVE_NAME"

      - name: Generate release notes
        id: release-notes
        run: |
          echo "📝 Generating release notes..."
          
          # Get previous tag
          PREVIOUS_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -2 | tail -1)
          CURRENT_TAG=${{ steps.validate-tag.outputs.tag }}
          
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "No previous tag found, creating initial release notes"
            RELEASE_NOTES="## 🎉 Initial Release

            This is the first release of GramFrame v${{ steps.validate-tag.outputs.version }}.

            ### 📦 What's Included
            - **GramFrame Component**: Complete standalone bundle (\`gramframe.bundle.js\`)
            - **Test Page**: Ready-to-use HTML sample (\`index.html\`)
            - **Demo Spectrogram**: Synthetic gram for verification (\`demo-gram.png\`)
            - **Documentation**: Usage guide and examples

            ### 🚀 Quick Start
            1. Download and extract the release archive
            2. **Double-click \`index.html\`** from your file explorer
            3. Component loads automatically - no web server required!

            ### 🔧 Key Features
            - **File Protocol Compatible**: Works directly from file system (double-click HTML files)
            - **Self-Contained**: Single JavaScript file with all dependencies bundled
            - **Auto-Detection**: Automatically enhances HTML tables with class \`gram-config\`
            - **Complete Modes**: Pan, Analysis, Harmonics, and Doppler interaction modes
            - **Training Ready**: Perfect for distributing spectrogram training materials"
          else
            echo "Generating changelog from $PREVIOUS_TAG to $CURRENT_TAG"
            
            # Generate commit log
            COMMIT_LOG=$(git log --pretty=format:"- %s (%h)" "$PREVIOUS_TAG..$CURRENT_TAG" | head -20)
            
            if [ -z "$COMMIT_LOG" ]; then
              COMMIT_LOG="- No commits found in this release"
            fi
            
            RELEASE_NOTES="## 🔄 Release v${{ steps.validate-tag.outputs.version }}

            ### 📦 What's Included
            - **GramFrame Component**: Complete standalone bundle (\`gramframe.bundle.js\`)
            - **Test Page**: Ready-to-use HTML sample (\`index.html\`)
            - **Demo Spectrogram**: Synthetic gram for verification (\`demo-gram.png\`)
            - **Documentation**: Usage guide and examples

            ### 🚀 Quick Start
            1. Download and extract the release archive
            2. **Double-click \`index.html\`** from your file explorer
            3. Component loads automatically - no web server required!

            ### 📋 Changes Since $PREVIOUS_TAG
            $COMMIT_LOG

            ### 🔗 Full Changelog
            Compare changes: [\`$PREVIOUS_TAG...$CURRENT_TAG\`](https://github.com/${{ github.repository }}/compare/$PREVIOUS_TAG...$CURRENT_TAG)"
          fi
          
          # Save release notes to file for GitHub release
          echo "$RELEASE_NOTES" > release-notes.md
          echo "✅ Release notes generated"
          echo "release-notes-file=release-notes.md" >> $GITHUB_OUTPUT

      - name: Create GitHub release
        id: create-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 Creating GitHub release..."
          
          # Create release with GitHub CLI
          RELEASE_URL=$(gh release create "${{ steps.validate-tag.outputs.tag }}" \
            --title "GramFrame v${{ steps.validate-tag.outputs.version }}" \
            --notes-file release-notes.md \
            --verify-tag \
            ./${{ steps.assets.outputs.archive-name }})
          
          echo "release-url=$RELEASE_URL" >> $GITHUB_OUTPUT
          echo "✅ Release created successfully: $RELEASE_URL"

      - name: Release summary
        run: |
          echo "🎉 Release completed successfully!"
          echo "📊 Release Summary:"
          echo "   - Tag: ${{ steps.validate-tag.outputs.tag }}"
          echo "   - Version: ${{ steps.validate-tag.outputs.version }}"
          echo "   - Archive: ${{ steps.assets.outputs.archive-name }}"
          echo "   - Release URL: ${{ steps.create-release.outputs.release-url }}"
          echo "✅ All steps completed successfully"

      - name: Notify completion
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            MESSAGE="✅ GramFrame v${{ steps.validate-tag.outputs.version }} released successfully! 
            🔗 Release URL: ${{ steps.create-release.outputs.release-url }}
            📦 Archive: ${{ steps.assets.outputs.archive-name }}"
          else
            MESSAGE="❌ GramFrame release v${{ steps.validate-tag.outputs.version }} failed
            📋 Check workflow logs for details"
          fi
          
          echo "Sending notification: $MESSAGE"
          curl -d "$MESSAGE" ntfy.sh/iancc2025 || echo "Notification failed but continuing..."