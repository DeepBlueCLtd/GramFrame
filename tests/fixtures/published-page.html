<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Published Page - no debug API</title>
  <link rel="stylesheet" href="../../src/gramframe.css" />

  <!--
    Stands in for published training material (spec 165, GF-23): a page that
    loads GramFrame WITHOUT setting window.GRAMFRAME_DEBUG. The __test__*
    methods must be absent here while the public API works normally.
    Deliberately has no debug flag — do not add one.
  -->
  <script type="module" src="../../src/main.js"></script>
</head>
<body>
  <h1>Published Page</h1>

  <div class="component-container">
    <table class="gram-config">
      <tr>
        <td colspan="2">
          <img src="../../sample/mock-gram.png" alt="Sample Spectrogram">
        </td>
      </tr>
      <tr><td>time-start</td><td>0</td></tr>
      <tr><td>time-end</td><td>60</td></tr>
      <tr><td>freq-start</td><td>0</td></tr>
      <tr><td>freq-end</td><td>100</td></tr>
    </table>
  </div>
</body>
</html>
