<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Config with no image - R9-02</title>
  <link rel="stylesheet" href="../../src/gramframe.css" />
  <script>window.GRAMFRAME_DEBUG = true</script>
  <script type="module" src="../../src/main.js"></script>
</head>
<body>
  <h1>Config table with no &lt;img&gt;</h1>
  <!-- The mistake an author makes by getting the row order wrong, or by
       pasting the parameter rows without the image row. -->
  <table class="gram-config">
    <tr><td>time-start</td><td>0</td></tr>
    <tr><td>time-end</td><td>60</td></tr>
    <tr><td>freq-start</td><td>0</td></tr>
    <tr><td>freq-end</td><td>100</td></tr>
  </table>
</body>
