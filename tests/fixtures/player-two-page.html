<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Player Page - two independent audio-sourced grams</title>
  <link rel="stylesheet" href="../../src/gramframe.css" />
  <script>window.GRAMFRAME_DEBUG = true</script>
  <script type="module" src="../../src/main.js"></script>
</head>
<body>
  <h1>Two players</h1>
  <!-- Two instances of the same recording (spec 168, FR-015): each decodes and
       analyses on its own, and playing one must not move the other. -->
  <div class="component-container">
    <table class="gram-config">
      <tr><td colspan="2"><audio src="./audio/tone-20s.wav"></audio></td></tr>
      <tr><td>window-seconds</td><td>5</td></tr>
      <tr><td>freq-end</td><td>3000</td></tr>
    </table>
    <table class="gram-config">
      <tr><td colspan="2"><audio src="./audio/tone-20s.wav"></audio></td></tr>
      <tr><td>window-seconds</td><td>4</td></tr>
      <tr><td>freq-end</td><td>2000</td></tr>
    </table>
  </div>
  <div class="diagnostics-panel" style="display:none;"><pre id="state-display">Loading...</pre></div>
</body>
</html>
