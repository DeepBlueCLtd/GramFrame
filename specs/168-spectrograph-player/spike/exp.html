<!DOCTYPE html><html><head><meta charset="utf-8"><title>spike</title></head><body>
<pre id="out">running</pre>
<svg id="svg" width="900" height="400" style="background:#000"><image id="img" x="0" y="0" width="900" height="400" preserveAspectRatio="none"/></svg>
<audio id="au" src="tone.wav"></audio>
<script src="tone.wav.js"></script>
<script>
const results = {}
const log = (k, v) => { results[k] = v; document.getElementById('out').textContent = JSON.stringify(results, null, 1) }
async function tryFetch() {
  try { const r = await fetch('tone.wav'); const b = await r.arrayBuffer(); return { ok: true, bytes: b.byteLength } }
  catch (e) { return { ok: false, error: String(e) } }
}
function tryXHR() {
  return new Promise(res => {
    try {
      const x = new XMLHttpRequest(); x.open('GET', 'tone.wav'); x.responseType = 'arraybuffer'
      x.onload = () => res({ ok: x.status === 200 || (x.status === 0 && x.response && x.response.byteLength > 0), status: x.status, bytes: x.response ? x.response.byteLength : 0 })
      x.onerror = () => res({ ok: false, status: x.status, error: 'onerror' })
      x.send()
    } catch (e) { res({ ok: false, error: String(e) }) }
  })
}
function b64ToBuf(b64) { const bin = atob(b64); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u.buffer }
async function tryDecode() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)()
    const buf = b64ToBuf(window.GramFrameAudio['tone.wav'])
    const t0 = performance.now()
    const ab = await ctx.decodeAudioData(buf)
    return { ok: true, ms: Math.round(performance.now() - t0), duration: ab.duration, sampleRate: ab.sampleRate, channels: ab.numberOfChannels, ctxRate: ctx.sampleRate }
  } catch (e) { return { ok: false, error: String(e) } }
}
async function tryAudioElement() {
  const au = document.getElementById('au')
  try {
    await au.play()
    await new Promise(r => setTimeout(r, 1500))
    return { ok: !au.paused && au.currentTime > 0.5, currentTime: au.currentTime, readyState: au.readyState, error: au.error && au.error.code }
  } catch (e) { return { ok: false, error: String(e), mediaError: au.error && au.error.code } }
}
async function tryMediaElementSource() {
  const au = document.getElementById('au')
  try {
    const ctx = new AudioContext()
    const src = ctx.createMediaElementSource(au)
    const an = ctx.createAnalyser(); an.fftSize = 2048
    src.connect(an); an.connect(ctx.destination)
    au.currentTime = 0; await au.play(); await ctx.resume()
    await new Promise(r => setTimeout(r, 1000))
    const td = new Float32Array(an.fftSize); an.getFloatTimeDomainData(td)
    let peak = 0; for (const v of td) peak = Math.max(peak, Math.abs(v))
    au.pause()
    return { ok: peak > 0.01, peak, ctxState: ctx.state }
  } catch (e) { return { ok: false, error: String(e) } }
}
// Radix-2 in-place FFT, real input packed as complex.
function makeFFT(n) {
  const rev = new Uint32Array(n); let bits = Math.log2(n)
  for (let i = 0; i < n; i++) { let r = 0, x = i; for (let b = 0; b < bits; b++) { r = (r << 1) | (x & 1); x >>= 1 } rev[i] = r }
  const cos = new Float32Array(n / 2), sin = new Float32Array(n / 2)
  for (let i = 0; i < n / 2; i++) { cos[i] = Math.cos(-2 * Math.PI * i / n); sin[i] = Math.sin(-2 * Math.PI * i / n) }
  return function (re, im) {
    for (let i = 0; i < n; i++) { const j = rev[i]; if (j > i) { let t = re[i]; re[i] = re[j]; re[j] = t; t = im[i]; im[i] = im[j]; im[j] = t } }
    for (let size = 2; size <= n; size <<= 1) {
      const half = size >> 1, step = n / size
      for (let start = 0; start < n; start += size) {
        for (let k = 0; k < half; k++) {
          const wr = cos[k * step], wi = sin[k * step]
          const i1 = start + k, i2 = i1 + half
          const xr = re[i2] * wr - im[i2] * wi, xi = re[i2] * wi + im[i2] * wr
          re[i2] = re[i1] - xr; im[i2] = im[i1] - xi; re[i1] += xr; im[i1] += xi
        }
      }
    }
  }
}
async function tryFFTPerf(samples, rate, fftSize, hop) {
  const fft = makeFFT(fftSize)
  const win = new Float32Array(fftSize); for (let i = 0; i < fftSize; i++) win[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (fftSize - 1))
  const frames = Math.floor((samples.length - fftSize) / hop) + 1
  const bins = fftSize / 2
  const mags = new Float32Array(frames * bins)
  const re = new Float32Array(fftSize), im = new Float32Array(fftSize)
  const t0 = performance.now(); let maxSlice = 0, sliceStart = performance.now(), f = 0
  while (f < frames) {
    const sliceT0 = performance.now()
    while (f < frames && performance.now() - sliceT0 < 12) {
      const off = f * hop
      for (let i = 0; i < fftSize; i++) { re[i] = samples[off + i] * win[i]; im[i] = 0 }
      fft(re, im)
      const row = f * bins
      for (let k = 0; k < bins; k++) mags[row + k] = re[k] * re[k] + im[k] * im[k]
      f++
    }
    maxSlice = Math.max(maxSlice, performance.now() - sliceT0)
    await new Promise(r => setTimeout(r, 0))
  }
  const total = performance.now() - t0
  // Check a known tone lands in the right bin: 300 Hz
  const expectBin = Math.round(300 / (rate / fftSize))
  let best = 0, bestK = -1; for (let k = 0; k < bins; k++) if (mags[100 * bins + k] > best) { best = mags[100 * bins + k]; bestK = k }
  return { frames, bins, totalMs: Math.round(total), maxSliceMs: Math.round(maxSlice), peakBin: bestK, expectedBin: expectBin, mags }
}
function paintPNG(mags, frames, bins, cropBins) {
  const t0 = performance.now()
  const c = document.createElement('canvas'); c.width = cropBins; c.height = frames
  const ctx = c.getContext('2d'); const id = ctx.createImageData(cropBins, frames); const d = id.data
  let max = 0; for (let i = 0; i < mags.length; i++) if (mags[i] > max) max = mags[i]
  const lmax = Math.log10(max + 1e-12), lmin = lmax - 6
  for (let f = 0; f < frames; f++) {
    const y = frames - 1 - f // time increases upward
    for (let k = 0; k < cropBins; k++) {
      const v = (Math.log10(mags[f * bins + k] + 1e-12) - lmin) / (lmax - lmin)
      const g = Math.max(0, Math.min(1, v))
      const p = (y * cropBins + k) * 4
      d[p] = g * 255; d[p + 1] = g * g * 200; d[p + 2] = 80 + (1 - g) * 100; d[p + 3] = 255
    }
  }
  ctx.putImageData(id, 0, 0)
  const url = c.toDataURL('image/png')
  return { ms: Math.round(performance.now() - t0), urlBytes: url.length, url }
}
async function tryImageRender(url, w, h) {
  const img = document.getElementById('img')
  img.setAttribute('width', '900'); img.setAttribute('height', String(h * 3)); img.setAttribute('y', String(400 - h * 3))
  img.setAttributeNS('http://www.w3.org/1999/xlink', 'href', url)
  await new Promise(r => setTimeout(r, 500))
  const bb = img.getBoundingClientRect()
  // scroll perf: move y for 60 frames
  let frames = 0; const t0 = performance.now()
  await new Promise(res => { function step() { img.setAttribute('y', String(400 - h * 3 + frames * 2)); frames++; if (performance.now() - t0 < 1000) requestAnimationFrame(step); else res() } requestAnimationFrame(step) })
  return { bbox: { w: Math.round(bb.width), h: Math.round(bb.height) }, fps: frames, naturalW: w, naturalH: h }
}
async function tryBigCanvas(w, h) {
  try { const c = document.createElement('canvas'); c.width = w; c.height = h; const ctx = c.getContext('2d'); ctx.fillStyle = '#123'; ctx.fillRect(0, 0, w, h); ctx.fillRect(0, h - 1, 1, 1); const p = ctx.getImageData(0, h - 1, 1, 1).data; const t0 = performance.now(); const u = c.toDataURL('image/png'); return { ok: p[3] === 255 && u.length > 100, urlBytes: u.length, ms: Math.round(performance.now() - t0) } } catch (e) { return { ok: false, error: String(e) } }
}
async function tryBigImage(w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; const ctx = c.getContext('2d'); ctx.fillStyle = '#0f0'; ctx.fillRect(0, 0, w, h)
  const url = c.toDataURL('image/png'); const im = new Image()
  return new Promise(res => { im.onload = () => res({ ok: true, natural: [im.naturalWidth, im.naturalHeight] }); im.onerror = () => res({ ok: false }); im.src = url })
}
async function tryWorker() {
  try { const blob = new Blob(['self.onmessage=e=>self.postMessage(e.data*2)'], { type: 'text/javascript' }); const w = new Worker(URL.createObjectURL(blob)); const r = await new Promise((res, rej) => { w.onmessage = e => res(e.data); w.onerror = e => rej(e.message); w.postMessage(21) }); return { ok: r === 42 } } catch (e) { return { ok: false, error: String(e) } }
}
(async () => {
  log('protocol', location.protocol)
  log('scriptEmbed', { ok: !!(window.GramFrameAudio && window.GramFrameAudio['tone.wav']), chars: window.GramFrameAudio ? window.GramFrameAudio['tone.wav'].length : 0 })
  log('fetch', await tryFetch())
  log('xhr', await tryXHR())
  log('worker', await tryWorker())
  const dec = await tryDecode(); log('decode', dec)
  log('audioElement', await tryAudioElement())
  log('mediaElementSource', await tryMediaElementSource())
  if (dec.ok) {
    const ctx = new AudioContext({ sampleRate: 22050 })
    const ab = await ctx.decodeAudioData(b64ToBuf(window.GramFrameAudio['tone.wav']))
    const samples = ab.getChannelData(0)
    const r = await tryFFTPerf(samples, ab.sampleRate, 1024, 512); const { mags, ...rest } = r; log('fft30s', rest)
    const crop = Math.round(4000 / (ab.sampleRate / 1024)) // 0-4 kHz
    const png = paintPNG(mags, r.frames, r.bins, crop); log('png30s', { ms: png.ms, urlBytes: png.urlBytes, w: crop, h: r.frames })
    log('imageRender', await tryImageRender(png.url, crop, r.frames))
    // 3-minute synthetic at 44.1k: reuse samples tiled x6 and upsampled notionally
    const big = new Float32Array(44100 * 180); for (let i = 0; i < big.length; i++) big[i] = samples[i % samples.length]
    const r2 = await tryFFTPerf(big, 44100, 1024, 512); delete r2.mags; log('fft3min', r2)
  }
  log('bigCanvas512x32768', await tryBigCanvas(512, 32768))
  log('bigCanvas2048x32768', await tryBigCanvas(2048, 32768))
  log('bigImage512x65535', await tryBigImage(512, 65535))
  log('done', true)
})()
</script></body></html>
